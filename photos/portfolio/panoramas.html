      <div class="panorama-carousel" role="region" aria-label="Panorama slideshow">

  <script>
    (function () {
      var ZOOM = 2.5;
      var MINIMAP_W = 110;

      var slides   = document.querySelectorAll('.panorama-carousel__slide');
      var captions = [
        'Siesta Beach, Sarasota at 7am',
        'John Ringling Venetian Palace',
        'John Ringling Museum of Art — The garden of the C\xe0 d\'Zan mansion',
        'Le salon de notre maison',
      ];
      var prevBtn   = document.getElementById('pan-prev');
      var nextBtn   = document.getElementById('pan-next');
      var captionEl = document.getElementById('pan-caption');
      var counterEl = document.getElementById('pan-counter');
      var current   = 0;
      var carousel  = document.querySelector('.panorama-carousel');

      var zoomState = Array.from(slides).map(function () {
        return { zoomed: false, tx: 0, ty: 0 };
      });

      // Inject minimap + hint into each slide
      slides.forEach(function (slide) {
        var img = slide.querySelector('.panorama-carousel__img');

        var minimap = document.createElement('div');
        minimap.className = 'panorama-minimap';
        var mmImg = document.createElement('img');
        mmImg.className = 'panorama-minimap__img';
        mmImg.src = img.src;
        mmImg.alt = '';
        mmImg.setAttribute('aria-hidden', 'true');
        var mmVP = document.createElement('div');
        mmVP.className = 'panorama-minimap__viewport';
        minimap.appendChild(mmImg);
        minimap.appendChild(mmVP);
        slide.appendChild(minimap);

        var hint = document.createElement('div');
        hint.className = 'panorama-zoom-hint';
        hint.textContent = 'click to zoom';
        hint.setAttribute('aria-hidden', 'true');
        slide.appendChild(hint);
      });

      function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

      function getGeometry(idx) {
        var slide = slides[idx];
        var img = slide.querySelector('.panorama-carousel__img');
        var cW = slide.offsetWidth;
        var cH = slide.offsetHeight;
        var natW = img.naturalWidth  || 3;
        var natH = img.naturalHeight || 1;
        var aspect = natW / natH;
        var dispW, dispH;
        if (cW / cH >= aspect) { dispH = cH; dispW = cH * aspect; }
        else                    { dispW = cW; dispH = cW / aspect; }
        return {
          cW: cW, cH: cH, dispW: dispW, dispH: dispH,
          maxTX: Math.max(0, (dispW * ZOOM - cW) / (2 * ZOOM)),
          maxTY: Math.max(0, (dispH * ZOOM - cH) / (2 * ZOOM)),
        };
      }

      function updateMinimap(idx) {
        var s = zoomState[idx];
        var slide = slides[idx];
        var minimap = slide.querySelector('.panorama-minimap');
        var mmVP = minimap.querySelector('.panorama-minimap__viewport');

        if (!s.zoomed) { minimap.classList.remove('panorama-minimap--visible'); return; }
        minimap.classList.add('panorama-minimap--visible');

        var g = getGeometry(idx);
        var mmH = Math.round(MINIMAP_W * g.dispH / g.dispW);
        minimap.style.width  = MINIMAP_W + 'px';
        minimap.style.height = mmH + 'px';

        var mmScale = MINIMAP_W / g.dispW;
        var vpLeft  = g.dispW / 2 - s.tx - g.cW / (2 * ZOOM);
        var vpTop   = g.dispH / 2 - s.ty - g.cH / (2 * ZOOM);

        mmVP.style.left   = clamp(vpLeft * mmScale, 0, MINIMAP_W) + 'px';
        mmVP.style.top    = clamp(vpTop  * mmScale, 0, mmH)       + 'px';
        mmVP.style.width  = (g.cW / ZOOM * mmScale) + 'px';
        mmVP.style.height = (g.cH / ZOOM * mmScale) + 'px';
      }

      function applyTransform(idx) {
        var s = zoomState[idx];
        var slide = slides[idx];
        var img = slide.querySelector('.panorama-carousel__img');
        var hint = slide.querySelector('.panorama-zoom-hint');
        if (s.zoomed) {
          img.style.transform = 'scale(' + ZOOM + ') translate(' + s.tx + 'px,' + s.ty + 'px)';
          slide.classList.add('panorama-carousel__slide--zoomed');
          if (hint) hint.classList.add('panorama-zoom-hint--hidden');
        } else {
          img.style.transform = '';
          slide.classList.remove('panorama-carousel__slide--zoomed');
          if (hint) hint.classList.remove('panorama-zoom-hint--hidden');
        }
        updateMinimap(idx);
      }

      function zoomIn(idx, clickX, clickY) {
        var s = zoomState[idx];
        var g = getGeometry(idx);
        s.zoomed = true;
        s.tx = clamp((clickX - g.cW / 2) * (1 - ZOOM) / ZOOM, -g.maxTX, g.maxTX);
        s.ty = clamp((clickY - g.cH / 2) * (1 - ZOOM) / ZOOM, -g.maxTY, g.maxTY);
        var img = slides[idx].querySelector('.panorama-carousel__img');
        img.style.transition = 'transform 0.3s ease';
        applyTransform(idx);
        setTimeout(function () { img.style.transition = ''; }, 350);
        var newH = Math.round(Math.min(window.innerHeight * 0.75, carousel.offsetWidth * 0.75));
        carousel.style.height = newH + 'px';
      }

      function zoomOut(idx) {
        var s = zoomState[idx];
        s.zoomed = false; s.tx = 0; s.ty = 0;
        var img = slides[idx].querySelector('.panorama-carousel__img');
        img.style.transition = 'transform 0.3s ease';
        applyTransform(idx);
        setTimeout(function () { img.style.transition = ''; }, 350);
        carousel.style.height = '';
      }

      // Mouse drag
      var drag = { active: false, idx: -1, startX: 0, startY: 0, lastX: 0, lastY: 0, moved: false };

      slides.forEach(function (slide, idx) {
        slide.addEventListener('mousedown', function (e) {
          drag.active = true; drag.idx = idx; drag.moved = false;
          drag.lastX = drag.startX = e.clientX;
          drag.lastY = drag.startY = e.clientY;
          if (zoomState[idx].zoomed) {
            slide.classList.add('panorama-carousel__slide--dragging');
            e.preventDefault();
          }
        });
      });

      document.addEventListener('mousemove', function (e) {
        if (!drag.active || !zoomState[drag.idx].zoomed) return;
        var dx = e.clientX - drag.lastX;
        var dy = e.clientY - drag.lastY;
        drag.lastX = e.clientX; drag.lastY = e.clientY;
        if (Math.abs(e.clientX - drag.startX) > 3 || Math.abs(e.clientY - drag.startY) > 3) drag.moved = true;
        var s = zoomState[drag.idx];
        var g = getGeometry(drag.idx);
        s.tx = clamp(s.tx + dx / ZOOM, -g.maxTX, g.maxTX);
        s.ty = clamp(s.ty + dy / ZOOM, -g.maxTY, g.maxTY);
        applyTransform(drag.idx);
      });

      document.addEventListener('mouseup', function (e) {
        if (!drag.active) return;
        var idx = drag.idx;
        var wasMoved = drag.moved;
        drag.active = false;
        slides[idx].classList.remove('panorama-carousel__slide--dragging');
        if (!wasMoved && idx === current) {
          var rect = slides[idx].getBoundingClientRect();
          if (!zoomState[idx].zoomed) zoomIn(idx, e.clientX - rect.left, e.clientY - rect.top);
          else zoomOut(idx);
        }
      });

      // Touch drag + swipe
      var tDrag = { active: false, idx: -1, startX: 0, startY: 0, lastX: 0, lastY: 0, moved: false };

      slides.forEach(function (slide, idx) {
        slide.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          tDrag.active = true; tDrag.idx = idx; tDrag.moved = false;
          tDrag.startX = tDrag.lastX = e.touches[0].clientX;
          tDrag.startY = tDrag.lastY = e.touches[0].clientY;
        }, { passive: true });

        slide.addEventListener('touchmove', function (e) {
          if (!tDrag.active || e.touches.length !== 1 || !zoomState[idx].zoomed) return;
          var dx = e.touches[0].clientX - tDrag.lastX;
          var dy = e.touches[0].clientY - tDrag.lastY;
          tDrag.lastX = e.touches[0].clientX;
          tDrag.lastY = e.touches[0].clientY;
          if (Math.abs(e.touches[0].clientX - tDrag.startX) > 5 ||
              Math.abs(e.touches[0].clientY - tDrag.startY) > 5) tDrag.moved = true;
          var s = zoomState[idx];
          var g = getGeometry(idx);
          s.tx = clamp(s.tx + dx / ZOOM, -g.maxTX, g.maxTX);
          s.ty = clamp(s.ty + dy / ZOOM, -g.maxTY, g.maxTY);
          applyTransform(idx);
          e.preventDefault();
        }, { passive: false });

        slide.addEventListener('touchend', function (e) {
          if (!tDrag.active) return;
          var wasMoved = tDrag.moved;
          var totalDX = e.changedTouches[0].clientX - tDrag.startX;
          var totalDY = e.changedTouches[0].clientY - tDrag.startY;
          tDrag.active = false;
          e.preventDefault();
          if (!zoomState[idx].zoomed) {
            if (Math.abs(totalDX) > 40 && Math.abs(totalDX) > Math.abs(totalDY)) {
              goTo(current + (totalDX < 0 ? 1 : -1));
            } else if (!wasMoved) {
              var touch = e.changedTouches[0];
              var rect = slide.getBoundingClientRect();
              zoomIn(idx, touch.clientX - rect.left, touch.clientY - rect.top);
            }
          } else if (!wasMoved) {
            zoomOut(idx);
          }
        });
      });

      // Carousel navigation
      function goTo(index) {
        if (zoomState[current].zoomed) {
          zoomState[current].zoomed = false;
          zoomState[current].tx = 0; zoomState[current].ty = 0;
          applyTransform(current);
          carousel.style.height = '';
        }
        slides[current].classList.remove('panorama-carousel__slide--active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('panorama-carousel__slide--active');
        captionEl.textContent = captions[current];
        counterEl.textContent = (current + 1) + ' / ' + slides.length;
      }

      prevBtn.addEventListener('click', function () { goTo(current - 1); });
      nextBtn.addEventListener('click', function () { goTo(current + 1); });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft')  goTo(current - 1);
        if (e.key === 'ArrowRight') goTo(current + 1);
      });
    })();
  </script>
